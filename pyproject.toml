[project]
name = "mcp-browser-bridge"
version = "0.2.6"
description = "Firefox extension MCP bridge with local native messaging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
mcp-browser-bridge = "mcp_browser_bridge.cli:main"
mcp-browser-bridge-native = "mcp_browser_bridge.native_host:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_browser_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
